server {
  listen 80;
  server_name _;

  location = /app.log {
    alias /usr/share/nginx/html/app.log;
    default_type text/plain;
    add_header Cache-Control "no-store";
  }

  location = /summary.log {
    alias /usr/share/nginx/html/summary.log;
    default_type text/plain;
    add_header Cache-Control "no-store";
  }

  location / {
    return 404;
  }
}